databases:
  - name: shortlink-db
    databaseName: shortlink
    user: shortlink
    plan: free

services:
  - type: web
    name: shortlink
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shortlink-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: BASE_URL
        value: https://shortlink.onrender.com
